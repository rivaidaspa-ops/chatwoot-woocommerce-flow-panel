services:
  panel:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatwoot_panel
      POSTGRES_USER: panel_user
      POSTGRES_PASSWORD: panel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  redis_data:
  postgres_data:
