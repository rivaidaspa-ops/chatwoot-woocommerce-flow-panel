services:
  panel:
    build: .
    container_name: chatwoot-woo-flow-panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://panel:panel_password@postgres:5432/paneldb
      CACHE_TTL_PRODUCTS_MS: 1800000
      CACHE_TTL_CLIENTE_MS: 120000
      VARIATION_CONCURRENCY: 6
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7-alpine
    container_name: chatwoot-woo-flow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:16-alpine
    container_name: chatwoot-woo-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: panel_password
      POSTGRES_DB: paneldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  redis_data:
  postgres_data:
